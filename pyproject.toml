[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discogs-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Discogs API (search, releases, collection, wantlist, marketplace)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "mcal8055" }]
keywords = ["mcp", "discogs", "music", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mcal8055/discogs_mcp"
Issues = "https://github.com/mcal8055/discogs_mcp/issues"

[project.scripts]
discogs-mcp = "discogs_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discogs_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
